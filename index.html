<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bocina Bajos</title>
<style>
:root{--bg:#14102b;--panel:#231b4d;--line:#3a2f7a;--pink:#ff4d8d;--yellow:#ffd23f;--text:#f3eeff;--mute:#a79fd6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh}
main{max-width:480px;margin:0 auto;padding:16px}
h1{margin:4px 0 12px;font:900 28px/1 "Arial Black",Impact,sans-serif;letter-spacing:-.5px}
canvas{width:100%;aspect-ratio:1/1;display:block;background:var(--panel);border:2px solid var(--line);border-radius:20px}
#title{margin:14px 0 4px;font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.time{display:flex;justify-content:space-between;color:var(--mute);font-size:13px}
input[type=range]{width:100%;accent-color:var(--pink);height:28px}
.ctl{display:flex;justify-content:center;align-items:center;gap:18px;margin:6px 0 14px}
button{font:inherit;color:var(--text);background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:10px 16px;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.play{width:68px;height:68px;border-radius:50%;background:var(--pink);border-color:var(--pink);font-size:26px;padding:0}
.ctl button:not(.play){width:52px;height:52px;padding:0;font-size:20px;border-radius:50%}
.row{margin:10px 0}
.row label{display:flex;justify-content:space-between;font-weight:600;font-size:14px}
.row b{color:var(--yellow)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.chips button{padding:8px 14px;font-size:14px}
.chips button.on{background:var(--yellow);color:#14102b;border-color:var(--yellow);font-weight:700}
.add{width:100%;background:transparent;border-style:dashed;margin:6px 0 10px}
ul{list-style:none;padding:0;margin:0}
li{padding:12px;border-bottom:1px solid var(--line);cursor:pointer;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
li.cur{color:var(--pink);font-weight:700}
.empty{color:var(--mute);text-align:center;padding:14px;font-size:14px}
.note{color:var(--mute);font-size:12px;margin-top:14px}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
</head>
<body>
<main>
<h1>Bocina Bajos</h1>
<canvas id="cv" width="480" height="480"></canvas>
<div id="title">Agrega música para empezar</div>
<div class="time"><span id="cur">0:00</span><span id="dur">0:00</span></div>
<input type="range" id="seek" min="0" max="1000" value="0" aria-label="Posición">
<div class="ctl">
<button id="prev" aria-label="Anterior">⏮</button>
<button id="pp" class="play" aria-label="Reproducir">▶</button>
<button id="next" aria-label="Siguiente">⏭</button>
</div>
<div class="chips" id="chips"></div>
<div class="row"><label>Graves <b id="vb">0 dB</b></label><input type="range" id="bass" min="0" max="18" step="1" value="0"></div>
<div class="row"><label>Sub-bajo <b id="vs">0 dB</b></label><input type="range" id="sub" min="0" max="12" step="1" value="0"></div>
<div class="row"><label>Volumen extra <b id="vv">100%</b></label><input type="range" id="vol" min="50" max="250" step="5" value="100"></div>
<button class="add" id="add">+ Agregar canciones</button>
<input type="file" id="file" accept="audio/*" multiple hidden>
<ul id="list"><li class="empty">Aún no hay canciones</li></ul>
<p class="note">Sube también el volumen del celular y de la bocina. Un limitador protege el sonido, pero con graves muy altos puede distorsionar: baja el nivel si suena sucio.</p>
</main>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
var audio=new Audio();audio.preload="auto";
var files=[],idx=-1,ctx,low,sub,gain,comp,an,data;
var PRESETS={Normal:[0,0,100],Bajos:[10,6,130],Party:[14,9,170],"Máximo":[18,12,220]};

function init(){
  if(ctx){if(ctx.state==="suspended")ctx.resume();return}
  var AC=window.AudioContext||window.webkitAudioContext;
  ctx=new AC();
  var src=ctx.createMediaElementSource(audio);
  low=ctx.createBiquadFilter();low.type="lowshelf";low.frequency.value=100;
  sub=ctx.createBiquadFilter();sub.type="peaking";sub.frequency.value=55;sub.Q.value=1.1;
  gain=ctx.createGain();
  comp=ctx.createDynamicsCompressor();
  comp.threshold.value=-14;comp.knee.value=12;comp.ratio.value=8;comp.attack.value=.003;comp.release.value=.2;
  an=ctx.createAnalyser();an.fftSize=256;data=new Uint8Array(an.frequencyBinCount);
  src.connect(low);low.connect(sub);sub.connect(gain);gain.connect(comp);comp.connect(an);an.connect(ctx.destination);
  apply();
}
function apply(){
  var b=+$("bass").value,s=+$("sub").value,v=+$("vol").value;
  $("vb").textContent=b+" dB";$("vs").textContent=s+" dB";$("vv").textContent=v+"%";
  if(ctx){low.gain.value=b;sub.gain.value=s;gain.gain.value=v/100}
  var on="";
  for(var k in PRESETS){var p=PRESETS[k];if(p[0]===b&&p[1]===s&&p[2]===v)on=k}
  var bt=$("chips").children;
  for(var i=0;i<bt.length;i++)bt[i].className=bt[i].textContent===on?"on":"";
}
["bass","sub","vol"].forEach(function(id){$(id).addEventListener("input",apply)});
Object.keys(PRESETS).forEach(function(k){
  var b=document.createElement("button");b.textContent=k;
  b.onclick=function(){var p=PRESETS[k];$("bass").value=p[0];$("sub").value=p[1];$("vol").value=p[2];apply()};
  $("chips").appendChild(b);
});

function fmt(t){if(!isFinite(t))return"0:00";var m=Math.floor(t/60),s=Math.floor(t%60);return m+":"+(s<10?"0":"")+s}
function name(f){return f.name.replace(/\.[^.]+$/,"")}
function render(){
  var ul=$("list");ul.innerHTML="";
  if(!files.length){ul.innerHTML='<li class="empty">Aún no hay canciones</li>';return}
  files.forEach(function(f,i){
    var li=document.createElement("li");li.textContent=name(f);
    if(i===idx)li.className="cur";
    li.onclick=function(){load(i,true)};
    ul.appendChild(li);
  });
}
function load(i,play){
  if(!files.length)return;
  init();
  idx=(i+files.length)%files.length;
  if(audio.dataset.url)URL.revokeObjectURL(audio.dataset.url);
  var u=URL.createObjectURL(files[idx]);audio.dataset.url=u;audio.src=u;
  $("title").textContent=name(files[idx]);render();
  if(play)audio.play().catch(function(){});
}
$("add").onclick=function(){$("file").click()};
$("file").onchange=function(e){
  var add=Array.prototype.slice.call(e.target.files);
  if(!add.length)return;
  var first=!files.length;
  files=files.concat(add);e.target.value="";
  if(first)load(0,true);else render();
};
$("pp").onclick=function(){
  if(!files.length){$("file").click();return}
  init();
  if(audio.paused)audio.play().catch(function(){});else audio.pause();
};
$("next").onclick=function(){load(idx+1,true)};
$("prev").onclick=function(){if(audio.currentTime>3)audio.currentTime=0;else load(idx-1,true)};
audio.onplay=function(){$("pp").textContent="⏸"};
audio.onpause=function(){$("pp").textContent="▶"};
audio.onended=function(){load(idx+1,true)};
audio.ontimeupdate=function(){
  $("cur").textContent=fmt(audio.currentTime);$("dur").textContent=fmt(audio.duration);
  if(audio.duration&&!seeking)$("seek").value=audio.currentTime/audio.duration*1000;
};
var seeking=false;
$("seek").addEventListener("input",function(){seeking=true;if(audio.duration)audio.currentTime=this.value/1000*audio.duration});
$("seek").addEventListener("change",function(){seeking=false});

var cv=$("cv"),g=cv.getContext("2d"),W=cv.width,sm=0;
function draw(){
  requestAnimationFrame(draw);
  var bass=0;
  if(an&&!audio.paused){an.getByteFrequencyData(data);var s=0;for(var i=0;i<5;i++)s+=data[i];bass=s/5/255}
  sm+= (bass-sm)*(bass>sm?.6:.12);
  var c=W/2,R=W*.42;
  g.clearRect(0,0,W,W);
  g.fillStyle="#231b4d";g.fillRect(0,0,W,W);
  // aros exteriores que se expanden con el bajo
  for(var k=3;k>=1;k--){
    g.beginPath();g.arc(c,c,R*(.9+k*.05*sm*2.2)+k*4,0,6.2832);
    g.strokeStyle="rgba(255,77,141,"+(.12+sm*.35)/k+")";g.lineWidth=3;g.stroke();
  }
  // borde del altavoz
  g.beginPath();g.arc(c,c,R,0,6.2832);g.fillStyle="#14102b";g.fill();
  g.lineWidth=6;g.strokeStyle="#3a2f7a";g.stroke();
  // cono
  var cone=R*(.62+sm*.18);
  g.beginPath();g.arc(c,c,cone,0,6.2832);g.fillStyle="#ff4d8d";g.fill();
  g.beginPath();g.arc(c,c,cone*.55,0,6.2832);g.fillStyle="#b3245f";g.fill();
  // tapa central
  g.beginPath();g.arc(c,c,cone*.22+sm*10,0,6.2832);g.fillStyle="#ffd23f";g.fill();
}
draw();
apply();
})();
</script>
</body>
</html>
